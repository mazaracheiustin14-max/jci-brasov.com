<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCI Business</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#130F2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Manualul de identitate JCI: albastru JCI #0097D7 pentru actiuni, negru JCI #130F2D pentru text si fundaluri inchise,
   navy #1F4789 si teal #57BCBC ca secundare, galben #EFC40F doar ca accent. Plus Jakarta Sans peste tot. Randuri liniate in loc de carduri. */
:root{
  --brand:#130F2D;--accent:#EFC40F;--on-accent:#130F2D;
  --bg:#EFF5FA;--surface:#FFFFFF;--ink:#130F2D;--ink-2:#55536B;
  --line:#D9E3EC;--line-strong:#74809C;
  --action:#0097D7;--on-action:#FFFFFF;--action-ink:#1F4789;--focus:#1F4789;
  --good:#1B6B45;--good-bg:#E3F2EA;--warn:#8A4B00;--warn-bg:#FBEBD3;--crit:#A61B2B;--crit-bg:#FBE4E6;
  --bar-bg:#130F2D;--bar-ink:#C7CEE0;--bar-active:#3DB5EA;
  --hero-bg:#1F4789;--hero-ink:#FFFFFF;--hero-num:#FFFFFF;
  --font-display:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --font-ui:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;
  --r-s:8px;--r-m:12px;--r-l:20px;--r-pill:999px;
  --tap:44px;--field:48px;--bar:64px;--rail:240px;--head:56px;
  --shadow:0 1px 2px rgb(19 15 45/.08),0 4px 12px rgb(19 15 45/.06);--t:150ms ease;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0920;--surface:#1A1638;--ink:#EEF1F8;--ink-2:#AEB4CC;--line:#2B2750;--line-strong:#727A9E;
    --action:#0097D7;--on-action:#FFFFFF;--action-ink:#6CC4EE;--focus:#EFC40F;
    --good:#5FCB94;--good-bg:#123A2C;--warn:#F0B35A;--warn-bg:#3E2C0E;--crit:#FF8A94;--crit-bg:#451620;--shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0920;--surface:#1A1638;--ink:#EEF1F8;--ink-2:#AEB4CC;--line:#2B2750;--line-strong:#727A9E;
  --action:#0097D7;--on-action:#FFFFFF;--action-ink:#6CC4EE;--focus:#EFC40F;
  --good:#5FCB94;--good-bg:#123A2C;--warn:#F0B35A;--warn-bg:#3E2C0E;--crit:#FF8A94;--crit-bg:#451620;--shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/24px var(--font-ui);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1{font:600 24px/30px var(--font-display);text-wrap:balance}
h2{font:600 20px/26px var(--font-display);text-wrap:balance}
h3{font:600 17px/24px var(--font-ui)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.small{font-size:14px;line-height:20px;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* aplicatia */
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{height:var(--head);background:var(--bar-bg);color:var(--hero-ink);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);position:sticky;top:0;z-index:20}
.logo{font:700 20px/1 var(--font-display);flex:1;letter-spacing:.01em}
.logo b{color:var(--accent);font-weight:700}
.ibtn{min-width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:var(--r-s);color:var(--hero-ink);padding:0 8px}
.ibtn:hover{background:rgb(255 255 255/.1)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font:600 14px/1 var(--font-ui);flex:none}
header.top .avatar{background:var(--accent);color:var(--on-accent);width:36px;height:36px}
select.branch{height:var(--tap);background:rgb(255 255 255/.12);color:var(--hero-ink);border:1px solid rgb(255 255 255/.35);border-radius:var(--r-s);padding:0 8px;font:500 14px var(--font-ui)}
select.branch option{color:#121A3D}
.demo-bar{background:var(--warn-bg);color:var(--warn);padding:8px var(--s4);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;line-height:20px}
.demo-bar select{height:36px;border-radius:var(--r-s);border:1px solid var(--warn);background:var(--surface);color:var(--ink);padding:0 8px;font:500 14px var(--font-ui)}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:var(--s6) var(--s4) calc(var(--bar) + var(--s12) + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bar-bg);display:flex;z-index:20}
nav.tabs button{flex:1;min-width:64px;border:0;background:transparent;color:var(--bar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px/16px var(--font-ui);position:relative}
nav.tabs button[aria-current="page"]{color:var(--bar-active)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--bar-active)}
nav.tabs svg{width:24px;height:24px}
@media (min-width:1024px){
  main{max-width:1120px;margin-left:var(--rail);margin-right:auto;width:calc(100% - var(--rail));padding:var(--s8) var(--s8) var(--s12)}
  nav.tabs{top:var(--head);bottom:auto;right:auto;width:var(--rail);height:auto;flex-direction:column;padding:var(--s4) 0;justify-content:flex-start}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 24px;height:var(--tap);min-height:var(--tap)}
  nav.tabs button[aria-current="page"]::before{top:8px;bottom:8px;left:0;right:auto;width:3px;height:auto}
}
.page-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.page-head h1{flex:1;min-width:140px}

/* componente */
.btn{min-height:var(--field);padding:0 var(--s6);border-radius:var(--r-s);border:1.5px solid var(--action);background:var(--action);color:var(--on-action);font:600 16px/1 var(--font-ui);transition:opacity var(--t)}
.btn:hover{opacity:.92}
.btn.sec{background:transparent;color:var(--action-ink);border-color:var(--action-ink)}
.btn.sm{min-height:var(--tap);padding:0 var(--s4)}
.btn.crit{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 var(--s2);margin-bottom:var(--s2)}
.chip{flex:none;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 14px/1 var(--font-ui);scroll-snap-align:start}
.chip[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.field{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s4)}
.field label,.lab{font:600 14px/20px var(--font-ui)}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=number],select.f,textarea{height:var(--field);width:100%;padding:0 var(--s3);border-radius:var(--r-s);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:400 16px var(--font-ui)}
textarea{height:auto;min-height:96px;padding:var(--s3);resize:vertical}
.help{font-size:13px;line-height:16px;color:var(--ink-2)}
.err{font-size:13px;line-height:16px;color:var(--crit);font-weight:600}
.check{display:flex;gap:var(--s3);align-items:flex-start;min-height:var(--tap);padding:var(--s2) 0}
.check input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--action)}
.check span{font-size:15px;line-height:22px}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);min-height:64px;border-bottom:1px solid var(--line);background:var(--surface);width:100%;text-align:left;border-left:4px solid transparent;border-top:0;border-right:0;color:var(--ink)}
button.row:hover{background:var(--bg)}
.row .grow{flex:1;min-width:0}
.row .grow span{display:block;overflow-wrap:anywhere}
.row .meta{font-size:14px;line-height:20px;color:var(--ink-2)}
.row .val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.list{border-top:1px solid var(--line);margin-bottom:var(--s6)}
.stripe-good{border-left-color:var(--good)}.stripe-warn{border-left-color:var(--warn)}.stripe-crit{border-left-color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);font:600 13px/16px var(--font-ui);white-space:nowrap}
.pill svg{width:14px;height:14px;flex:none}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.neutral{background:var(--bg);color:var(--ink-2)}
.seal{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;background:var(--accent);color:var(--on-accent);border-radius:var(--r-s);font:600 13px/16px var(--font-ui)}
.seal svg{width:14px;height:14px}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--r-m);padding:var(--s6);margin-bottom:var(--s4)}
.hero .l{font:600 13px/16px var(--font-ui);letter-spacing:.04em;text-transform:uppercase}
.hero .n{font:600 32px/36px var(--font-display);color:var(--hero-num);margin:var(--s1) 0;font-variant-numeric:tabular-nums}
.hero .n small{font:400 14px var(--font-ui);color:var(--hero-ink)}
.hero .s{font-size:14px;line-height:20px}
.sums{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:var(--s6)}
.sums>div{padding:var(--s4);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.sums .l{font:600 13px/16px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.sums .n{font:600 24px/30px var(--font-display);font-variant-numeric:tabular-nums;margin:4px 0}
.sums .n small{font:400 14px var(--font-ui);color:var(--ink-2)}
@media (min-width:640px){.sums{grid-template-columns:repeat(4,1fr)}}
table.cmp{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px;line-height:20px;margin-bottom:var(--s6)}
.tw{overflow-x:auto;margin-bottom:var(--s6)}
table.cmp th,table.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp th{font:600 13px/16px var(--font-ui);color:var(--ink-2);background:var(--bg)}
.sec-h{margin:var(--s6) 0 var(--s3)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-s);padding:var(--s3) var(--s4);font-size:14px;line-height:20px;margin-bottom:var(--s4)}
.notice.info{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.empty{text-align:center;padding:var(--s8) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3);background:var(--surface);border-bottom:1px solid var(--line)}
.empty svg{width:48px;height:48px;color:var(--ink-2)}
.empty p{max-width:40ch;color:var(--ink-2)}
.offer{background:var(--bg);border-left:3px solid var(--accent);padding:var(--s3) var(--s4);border-radius:0 var(--r-s) var(--r-s) 0;margin:var(--s4) 0;overflow-wrap:anywhere}
.profile-head{display:flex;gap:var(--s4);align-items:center;margin-bottom:var(--s4)}
.profile-head .avatar{width:56px;height:56px;font-size:18px}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
/* foaie */
#sheetwrap{position:fixed;inset:0;background:rgb(10 14 40/.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheetwrap.open{display:flex}
#sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:var(--s6) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
@media (min-width:1024px){#sheetwrap{align-items:stretch;justify-content:flex-end}#sheet{max-width:440px;max-height:none;border-radius:0}}
#sheet h2{margin-bottom:var(--s4)}
.sheet-acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-s);z-index:60;font-size:14px;display:none;max-width:90vw}
@media (min-width:1024px){#toast{bottom:24px}}
.gate{min-height:100vh;background:var(--brand);display:flex;align-items:flex-end;justify-content:center}
.gate-in{background:var(--surface);width:100%;max-width:560px;border-radius:var(--r-l) var(--r-l) 0 0;padding:var(--s6) var(--s4)}
.gate-top .logo img{height:68px!important}
.gate-top{color:var(--hero-ink);padding:var(--s8) var(--s4);position:absolute;top:0;left:0;right:0}
.skel{height:64px;background:var(--line);border-bottom:1px solid var(--bg);animation:p 1.2s infinite alternate}
@keyframes p{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{transition:none!important}}
.sep{display:inline-block;width:1px;height:12px;background:var(--line-strong);margin:0 8px;vertical-align:middle}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s||"").replace(/ş/g,"s").replace(/Ş/g,"S").replace(/ţ/g,"t").replace(/Ţ/g,"T").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function fmt(b){return (b/100).toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2})}
function toBani(s){
  s=String(s==null?"":s).trim();
  if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s))s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d+(,\d{1,2})?$/.test(s))s=s.replace(",",".");
  else if(!/^\d+(\.\d{1,2})?$/.test(s))return NaN;
  var n=Math.round(parseFloat(s)*100);return(isFinite(n)&&n<=100000000000)?n:NaN;
}
function amtMsg(raw,b){
  if(!String(raw==null?"":raw).trim())return"Completează câmpul Suma.";
  if(isNaN(b))return"Introdu suma în lei, de exemplu 1.250,50.";
  if(!(b>0))return"Suma trebuie să fie mai mare ca zero.";
  return"";
}
function safe(fn){try{return Promise.resolve(fn()).catch(function(){})}catch(e){return Promise.resolve()}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addMonths(ds,n){var p=String(ds).split("-");var y=+p[0],m=+p[1]-1+n,d=+p[2];var ny=y+Math.floor(m/12),nm=((m%12)+12)%12;var last=new Date(ny,nm+1,0).getDate();return ny+"-"+String(nm+1).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0")}
function addDays(ds,n){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function defaultValid(){return new Date().getFullYear()+"-12-31"}
function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
var CODE_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genCode(){var a=new Uint32Array(12);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<12;i++)a[i]=Math.floor(Math.random()*4294967296)}var o="";for(var j=0;j<12;j++)o+=CODE_ALPHA.charAt(a[j]%32);return o}
function fmtCode(c){return String(c).replace(/(.{4})(?=.)/g,"$1-")}
function stripId(o){var r=Object.assign({},o);delete r.id;return r}
function fmtAt(iso){var d=new Date(iso);if(!iso||isNaN(d))return String(iso||"").slice(0,16).replace("T"," ");function z(n){return String(n).padStart(2,"0")}return z(d.getDate())+"."+z(d.getMonth()+1)+"."+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes())}
function dro(d){if(!d)return"";d=String(d);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return esc(d);var p=d.split("-");return p[2]+"."+p[1]+"."+p[0]}
function uid(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}
  var a="";for(var i=0;i<4;i++)a+=Math.random().toString(36).slice(2,8);return Date.now().toString(36)+a;
}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function safeHttps(u){return/^https:\/\//i.test(u)?u:""}

function normSnap(s){
  var out=[];var arr=[];
  if(Array.isArray(s))arr=s;else if(s&&s.docs)arr=s.docs;else if(s&&typeof s.forEach==="function")s.forEach(function(d){arr.push(d)});
  arr.forEach(function(d){
    var data=(typeof d.data==="function")?d.data():(d.data&&typeof d.data==="object"?d.data:d);
    var id=d.id||(data&&data.id);
    if(id==null)return;
    var o={};for(var k in data)o[k]=data[k];o.id=id;out.push(o);
  });
  return out;
}
function makeLiveStore(db){
  var unsubs=[];
  return{
    live:true,
    sub:function(path,cb){
      try{var u=db.collection(path).onSnapshot(function(s){cb(normSnap(s))},function(e){cb(null,e)});if(typeof u==="function")unsubs.push(u)}catch(e){cb(null,e)}
    },
    set:function(path,id,obj){return db.collection(path).doc(id).set(obj)},
    del:function(path,id){return db.collection(path).doc(id).delete()},
    reset:function(){unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[]}
  };
}
function makeHttpStore(){
  var subs={},revs={},timer=0,t0=0,inflight=false,again=false,started=false;
  function post(url,body){
    return fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{status:r.status,body:j}})});
  }
  function fireAll(paths,err){paths.forEach(function(p){delete revs[p];(subs[p]||[]).forEach(function(cb){cb(null,err)})})}
  function pull(){
    if(inflight){again=true;return Promise.resolve()}
    var paths=Object.keys(subs);if(!paths.length)return Promise.resolve();
    inflight=true;
    return post("/api/app/pull",{paths:paths,revs:revs}).then(function(r){
      inflight=false;
      if(r.status===401||(r.status===403&&r.body&&r.body.excluded)){location.reload();return}
      if(r.status!==200){fireAll(paths,new Error("http "+r.status));return}
      var d=r.body.data||{},er=r.body.errors||{},rv=r.body.rev||{};
      paths.forEach(function(p){
        if(er[p]){delete revs[p];(subs[p]||[]).forEach(function(cb){cb(null,new Error("acces "+er[p]))});return}
        if(rv[p]!==undefined)revs[p]=rv[p];
        if(d[p]!==undefined)(subs[p]||[]).forEach(function(cb){cb(d[p])});
      });
    }).catch(function(){inflight=false;fireAll(paths,new Error("rețea"))}).then(function(){if(again){again=false;return pull()}});
  }
  function loop(){clearTimeout(timer);timer=setTimeout(function(){if(!document.hidden)pull();loop()},30000)}
  function write(body){
    return post("/api/app/write",body).then(function(r){
      if(r.status===401){location.reload();throw new Error("sesiune")}
      if(r.status!==200)throw new Error((r.body&&r.body.error)||("http "+r.status));
      return pull();
    });
  }
  if(!window._jcibVis){window._jcibVis=1;document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.store&&S.store.server)S.store.refresh()})}
  return{
    live:true,server:true,
    sub:function(path,cb){(subs[path]=subs[path]||[]).push(cb);clearTimeout(t0);t0=setTimeout(pull,20);if(!started){started=true;loop()}},
    set:function(path,id,obj){return write({path:path,id:id,data:obj})},
    del:function(path,id){return write({path:path,id:id,del:true})},
    refresh:function(){return pull()},
    reset:function(){subs={};revs={};clearTimeout(timer);clearTimeout(t0);started=false}
  };
}
function makeMemStore(seed){
  var data={},subs={};
  function list(p){var m=data[p]||{};return Object.keys(m).map(function(k){var o=JSON.parse(JSON.stringify(m[k]));o.id=k;return o})}
  function emit(p){(subs[p]||[]).forEach(function(cb){cb(list(p))})}
  var st={
    live:false,
    sub:function(p,cb){(subs[p]=subs[p]||[]).push(cb);setTimeout(function(){cb(list(p))},0)},
    set:function(p,id,o){(data[p]=data[p]||{})[id]=JSON.parse(JSON.stringify(o));emit(p);return Promise.resolve()},
    del:function(p,id){if(data[p])delete data[p][id];emit(p);return Promise.resolve()},
    reset:function(){subs={}}
  };
  if(seed)seed(function(p,id,o){(data[p]=data[p]||{})[id]=o});
  return st;
}

function getSettings(b){var st=col("branches/"+b+"/settings").filter(function(x){return x.id==="main"})[0]||{};return{opening:st.opening||0,feeDue:st.feeDue||30000,id:"main"}}
function report(b){
  var fees=activeRows("branches/"+b+"/fees"),don=activeRows("branches/"+b+"/donations"),exp=activeRows("branches/"+b+"/expenses");
  var st=getSettings(b);var opening=st.opening||0;
  var r={opening:opening,incasat:0,avansTotal:0,creanta:0,restanti:[],donN:0,donA:0,cheltPlatit:0,angajat:0,pe:{},nrCreanta:0,nrFees:fees.length,nrPlatite:0,avansRec:0};
  var t=today();
  fees.forEach(function(f){
    if(f.state==="platita"){r.incasat+=f.paid||0;r.nrPlatite++}
    else if(f.state==="avans"){r.avansTotal+=f.paid||0;r.nrPlatite++;if(f.recovered){r.avansRec+=f.paid||0}else{r.creanta+=f.paid||0;r.nrCreanta++}}
    else if(f.state==="neplatita"&&f.deadline&&f.deadline<t){r.restanti.push(f)}
  });
  don.forEach(function(d){if(d.anonymous)r.donA+=d.amount;else r.donN+=d.amount});
  exp.forEach(function(e){
    if(e.state==="platita"){r.cheltPlatit+=e.amount;r.pe[e.category]=(r.pe[e.category]||0)+e.amount}
    else if(e.state==="aprobata"){r.angajat+=e.amount}
  });
  r.donatii=r.donN+r.donA;r.restSum=r.restanti.reduce(function(s,f){return s+(f.due-(f.paid||0))},0);
  r.sold=opening+r.incasat+r.donatii-r.cheltPlatit;r.disponibil=r.sold-r.angajat;
  return r;
}
function fracWarn(b,e){
  if(!e.supplier||e.amount>THRESH)return false;
  var d0=new Date(e.date||today()).getTime();var sum=e.amount;
  activeRows("branches/"+b+"/expenses").forEach(function(x){
    if(x.id===e.id||!x.supplier||x.state==="respinsa")return;
    if(norm(x.supplier)===norm(e.supplier)){var dt=new Date(x.date||today()).getTime();if(Math.abs(dt-d0)<=30*864e5)sum+=x.amount}
  });

}

async function verifyClaim(b,code,c){
  var t=today();
  if(code.used){await put("claims",c.id,Object.assign(stripId(c),{status:"Cod deja folosit"}),"claim","Cerere cu cod deja folosit");return}
  if(code.expiresAt&&code.expiresAt<t){await put("claims",c.id,Object.assign(stripId(c),{status:"Cod expirat"}),"claim","Cerere cu cod expirat");return}
  var m=col("branches/"+b+"/members").filter(function(x){return x.id===code.memberId})[0];
  if(!m){await put("claims",c.id,Object.assign(stripId(c),{status:"Membrul nu mai există în evidență"}),"claim","Cerere fără membru în evidență");return}
  var mo=stripId(m);mo.userId=c.id;mo.validUntil=code.validUntil||m.validUntil||defaultValid();
  if(!(await put("branches/"+b+"/members",m.id,mo,"update","Cont legat prin cod: "+m.name)))return;
  await recomputeBadge(b,m.id,Object.assign({id:m.id},mo));
  await put("branches/"+b+"/codes",code.id,Object.assign(stripId(code),{used:true,usedBy:c.id,usedAt:t}),"code","Cod folosit de "+m.name);
  await put("claims",c.id,Object.assign(stripId(c),{processed:true,status:"Verificat",branch:b,memberId:m.id,name:m.name}),"claim","Membru verificat prin cod: "+m.name);
}
S.auto={};
async function autoProcess(){
  if(S.server||S.mode!=="ready"||!isLead()||!canWrite()||S._busy)return;
  S._busy=true;
  try{
    var claims=col("claims").slice();
    for(var i=0;i<claims.length;i++){
      var c=claims[i];if(!c.code||c.processed)continue;
      var key="c:"+c.id+":"+c.code;if(S.auto[key])continue;
      var bs=scopeBranches();
      for(var k=0;k<bs.length;k++){
        var code=col("branches/"+bs[k]+"/codes").filter(function(x){return x.id===c.code})[0];
        if(code){S.auto[key]=1;await verifyClaim(bs[k],code,c);break}
      }
    }
    var scope=scopeBranches();
    for(var j=0;j<scope.length;j++){
      var ms=col("branches/"+scope[j]+"/members");
      for(var q=0;q<ms.length;q++){
        var m=ms[q];if(!m.userId)continue;
        var bd=badgeOf(m.userId);
        if(bd&&bd.verified&&!bd.excluded&&badgeState(bd)==="excluded"){
          var k2="x:"+m.userId+":"+bd.validUntil;if(S.auto[k2])continue;S.auto[k2]=1;
          await put("badges",m.userId,Object.assign(stripId(bd),{excluded:true,active:false}),"exclusion","Exclus automat din aplicație: "+m.name+" (peste 3 luni de la expirare)");
        }
      }
    }
  }catch(e){}finally{S._busy=false}
}

function svPost(url,body){return fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{status:r.status,body:j}})})}
function showServerLogin(){
  var app=document.getElementById("app");app.innerHTML=renderServerLogin();
  function handle(form,errId,url,field){
    form.addEventListener("submit",function(ev){
      ev.preventDefault();var e=document.getElementById(errId);e.textContent="";
      var v=String(new FormData(form).get(field)||"");
      if(field==="code"&&normCode(v).length!==12){e.textContent="Codul are 12 caractere, de exemplu K7M2-9QXA-4TLD.";return}
      var b={};b[field]=v;
      svPost(url,b).then(function(r){
        if(r.status===200){location.reload();return}
        if(r.status===403&&r.body.excluded){S.mode="excluded";app.innerHTML=renderExcluded(r.body);return}
        e.textContent=r.body.error||"Nu am putut intra. Încearcă din nou.";
      }).catch(function(){e.textContent="Nu am putut contacta serverul. Verifică conexiunea."});
    });
  }
  handle(document.getElementById("svform"),"lgerr","/api/app/login","code");
  handle(document.getElementById("modform"),"mderr","/api/app/modlogin","key");
}

async function saveProfile(fd){

  var em=String(fd.get("email")||"").trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast("Adresa de e-mail nu este validă.");return}
  var c={directory:!!fd.get("c_dir"),phone:!!fd.get("c_phone"),email:!!fd.get("c_mail"),offer:!!fd.get("c_offer"),version:CONSENT_VERSION,at:new Date().toISOString()};

  var id=S.me.id;var warn=false;

  toast(warn?"Profilul a fost salvat, dar o parte din date nu s-a scris. Salvează din nou din Profilul meu.":"Modificările au fost salvate.");
}

function vFees(){

  if(S.err["branches/"+b+"/fees"])return h+emptyBox("Nu ai acces la această secțiune","Evidențele financiare sunt vizibile doar conducerii filialei.","Înapoi la Director","godir");
  if(S.feeView==="members"){

    return h+(ms.length?'<div class="list">'+ms.map(function(m){var bd=m.userId?badgeOf(m.userId):null;return row({act:"member",id:m.id,avatar:m.name,title:m.name,meta:m.userId?(S.server?"Cont activ":"Cont legat"):(S.server?"Cont neactivat":"Fără cont în aplicație"),right:badgeState(bd)==="active"?'<span class="seal">'+svg("seal",14)+'Membru activ</span>':""})}).join("")+'</div>':emptyBox("Niciun membru în evidență","Adaugă membrii filialei ca să le poți înregistra cotizațiile.","Adaugă membru","newmember"));
  }
  var t=today();
  var chips=[["Toate","Toate"],["plătită","Plătite"],["restantă","Restante"],["avans","Avans terț"],["scutită","Scutite"]];
  h+='<div class="chips">'+chips.map(function(c){return'<button class="chip" data-act="ff" data-id="'+c[0]+'" aria-pressed="'+(S.feeFilter===c[0])+'">'+c[1]+'</button>'}).join("")+'</div>';
  var fees=col("branches/"+b+"/fees").filter(function(f){
    if(f.anulat)return S.feeFilter==="Toate";

    if(S.feeFilter==="restantă")return f.state==="neplatita"&&f.deadline&&f.deadline<t;
    if(S.feeFilter==="avans")return f.state==="avans";

  }).sort(function(a,c){return(c.createdAt||"")<(a.createdAt||"")?-1:1});

  return h+'<div class="list">'+fees.map(function(f){
    var overdue=f.state==="neplatita"&&f.deadline&&f.deadline<t;
    var pl=f.anulat?'<span class="pill neutral">'+svg("x",14)+'Anulată</span>':overdue?'<span class="pill crit">'+svg("warn",14)+'Restantă</span>':pill(FEE_STATE,f.state);
    return row({act:"fee",id:f.id,stripe:f.anulat?"":(f.state==="platita"?"good":overdue?"crit":f.state==="avans"?"warn":""),title:memberName(b,f.memberId),meta:esc("An "+f.year+" | termen "+dro(f.deadline)+(f.recovered?" | recuperat":"")),right:'<span class="num"><b>'+fmt(f.due)+' RON</b></span>'+pl});
  }).join("")+'</div><button class="btn sec sm" data-act="csvfees">Copiază CSV</button>';
}

/* ===================== foaie (sheet) ===================== */
function openSheet(html,onSubmit){
  var s=document.getElementById("sheet");s.innerHTML=html;
  document.getElementById("sheetwrap").classList.add("open");
  var f=s.querySelector("form");
  if(f&&onSubmit)f.addEventListener("submit",function(ev){ev.preventDefault();onSubmit(new FormData(f),f)});
  var first=s.querySelector("input,select,textarea,button");if(first&&window.innerWidth>700)first.focus();
}
function closeSheet(){document.getElementById("sheetwrap").classList.remove("open");document.getElementById("sheet").innerHTML=""}
function sel(name,opts,val,label,id){return'<div class="field"><label for="'+id+'">'+label+'</label><select class="f" id="'+id+'" name="'+name+'">'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return'<option value="'+esc(v)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(l)+'</option>'}).join("")+'</select></div>'}
function inp(name,label,val,type,id,extra){return'<div class="field"><label for="'+id+'">'+label+'</label><input type="'+(type||"text")+'" id="'+id+'" name="'+name+'" value="'+esc(val==null?"":val)+'" '+(extra||"")+'></div>'}
function fieldErr(msg){var e=document.getElementById("sheeterr");if(e){e.textContent=msg;e.setAttribute("role","alert")}return false}

function showCode(name,cd,exp){openSheet('<h2>Cod pentru '+esc(name)+'</h2><p class="small">Transmite-i codul membrului. Expiră la '+dro(exp)+'. Nu îl mai poți vedea după ce închizi fereastra.</p><p class="num" style="font-size:28px;font-family:monospace;margin:16px 0;overflow-wrap:anywhere">'+fmtCode(cd)+'</p><div class="sheet-acts"><button class="btn" data-act="copycode" data-id="'+cd+'">Copiază codul</button><button class="btn sec" data-act="closesheet">Închide</button></div>')}

function sheetFee(){
  var b=curBranch();var ms=col("branches/"+b+"/members");

  var yr=2027;

   sel("state",[["neplatita","Neplătită"],["platita","Plătită"],["avans","Plătită în avans de terț"],["scutita","Scutită"]],"neplatita","Stare","fs")+inp("paidOn","Data plății","","date","fp")+sel("method",["transfer bancar","card","numerar","compensare cu președintele"],"transfer bancar","Metoda","fmt")+inp("thirdParty","Plătitor terț (la plată în avans)","","text","ft")+inp("reason","Motiv scutire (la scutire)","","text","fr")+inp("decision","Hotărâre Consiliu pentru scutire (număr)","","text","fh")+inp("decisionDate","Data hotărârii","","date","fhd")+
   '<div class="err" id="sheeterr"></div><div class="sheet-acts"><button class="btn" type="submit">Salvează</button><button class="btn sec" type="button" data-act="closesheet">Anulează</button></div></form>',async function(fd){

    if(st==="scutita"&&(String(fd.get("reason")||"").trim().length<10||!String(fd.get("decision")||"").trim()||!fd.get("decisionDate")))return fieldErr("Scutirea cere un motiv de minimum 10 caractere și hotărârea Consiliului (număr și dată).");
    var mid=fd.get("memberId");
    var dup=activeRows("branches/"+b+"/fees").some(function(f){return f.memberId===mid&&String(f.year)===String(fd.get("year"))});

    var id=uid();

  });

          if(fd.get("role")==="member")await S.store.del("roles",target);
          else await S.store.set("roles",target,{role:fd.get("role"),branch:fd.get("role")==="national"?"":fd.get("branch"),since:ex&&ex.since?ex.since:today(),until:fd.get("role")==="president"?(fd.get("until")||defaultValid()):""});
          await safe(function(){return audit("roles",target,"role",(fd.get("role")==="member"?"Rol retras: ":"Rol atribuit ("+(ROLE_LABEL[fd.get("role")]||fd.get("role"))+"): ")+nameOf(target))});closeSheet();toast("Modificările au fost salvate.");
        }catch(e){toast(S.server?"Nu am putut salva rolul.":"Doar proprietarul poate atribui roluri.")}});break}
    case"csvfees":copyText(csv([["membru","an","suma_datorata","stare","data_plata","metoda","platitor_tert","recuperat","anulat"]].concat(col("branches/"+b+"/fees").map(function(f){return[memberName(b,f.memberId),f.year,f.due/100,FEE_STATE[f.state][0],f.paidOn||"",f.method||"",f.thirdParty||"",f.recovered?"da":"nu",f.anulat?"da":"nu"]}))),"CSV copiat.");break;
    case"csvdon":copyText(csv([["donator","suma","data","scop","tip","document","anulat"]].concat(col("branches/"+b+"/donations").map(function(d){return[d.anonymous?"Anonim":(myRole().role==="national"?"(ascuns)":d.donor),d.amount/100,d.date,d.purpose,d.type,d.doc,d.anulat?"da":"nu"]}))),"CSV copiat.");break;
    case"csvexp":copyText(csv([["categorie","descriere","suma","data","furnizor","document","stare"]].concat(col("branches/"+b+"/expenses").map(function(e){return[e.category,e.desc,e.amount/100,e.date,e.supplier,e.docNo,e.anulat?"anulată":EXP_STATE[e.state][0]]}))),"CSV copiat.");break;
  }
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");
  if(t){onAct(t.getAttribute("data-act"),t.getAttribute("data-id"));return}

});
document.addEventListener("focusout",function(){setTimeout(function(){if(S._stale)render()},80)});

document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeSheet()});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");if(tabsFor().some(function(t){return t[0]===h})&&h!==S.tab){S.tab=h;render()}});

/* ===================== pornire ===================== */
async function start(){
  var th=lsGet("jcib-theme");if(th)document.documentElement.setAttribute("data-theme",th);
  S.mode="loading";render();
  if(S.server){
    try{
      var rs=await fetch("/api/app/me",{credentials:"same-origin"});var js=await rs.json().catch(function(){return{}});
      if(rs.status===200){S.me={id:String(js.id),isOwner:js.isOwner===true,name:String(js.name||""),branch:String(js.branch||"")};S.store=makeHttpStore();S.mode="ready";var hs=location.hash.replace("#","");if(hs)S.tab=hs;subscribeAll();render();return}
      if(rs.status===403&&js.excluded){S.mode="excluded";document.getElementById("app").innerHTML=renderExcluded(js);return}
      if(rs.status===401){S.mode="login";showServerLogin();return}
    }catch(e){}
    S.mode="error";render();return;
  }
  var live=false;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      var timeout=new Promise(function(r){setTimeout(function(){r(null)},6000)});
      var got=await Promise.race([Promise.all([window.claude.use("db"),window.claude.use("user")]),timeout]);
      if(got&&got[0]&&got[1]){
        var db=got[0],user=got[1];
        var id=await user.id();
        var ow=await Promise.resolve(user.isOwner&&user.isOwner());
        S.me={id:String(id),isOwner:ow===true};
        S.store=makeLiveStore(db);live=true;
      }
    }
  }catch(e){live=false}
  if(!live){
    if(window.claude&&typeof window.claude.use==="function"){S.mode="error";render();return}
    S.store=makeMemStore(demoSeed);S.me={id:"u-nat",isOwner:false};
    S.note="";
  }
  S.mode="ready";
  var h=location.hash.replace("#","");if(h)S.tab=h;
  subscribeAll();render();
}
start();
